<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      Brand pass: #132719 is moss-900, matching vite.config.ts's PWA manifest
      theme_color exactly. This is the one file in this agent's paths allowed
      to carry a literal hex value — a <meta> tag cannot reference a JS token.
    -->
    <meta name="theme-color" content="#132719" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <!--
      Manual manifest link, kept deliberately: vite-plugin-pwa's dev server
      only rewrites index.html when `devOptions.enabled` is true in
      vite.config.ts, which it currently is not (vite.config.ts is
      orchestrator-only — see the wave-1 pwa-screens report for the ask), so
      `npm run dev` never injects one. `npm run build` *does* inject its own
      copy of this same tag unconditionally; the harmless duplicate in the
      production `dist/index.html` is the trade-off for a manifest link that
      actually resolves in dev.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Veteran's Carbon Holdings — Sampler</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
